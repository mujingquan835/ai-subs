name: AISubscriptions
options:
  deploymentTarget:
    macOS: '14.0'
settings:
  base:
    # 签名团队：由环境变量 AISUB_TEAM_ID 提供（scripts/install.sh 会从本机开发者证书自动读取）
    DEVELOPMENT_TEAM: ${AISUB_TEAM_ID}
    # App 与小组件共享数据用的 App Group，macOS 上以团队 ID 开头，无需额外注册
    APP_GROUP_ID: $(DEVELOPMENT_TEAM).local.dawang.aisubscriptions
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: Apple Development
    PROVISIONING_PROFILE_SPECIFIER: ''
    SWIFT_VERSION: '5.0'
    DEVELOPMENT_LANGUAGE: zh-Hans
    MARKETING_VERSION: '1.1'
    CURRENT_PROJECT_VERSION: '1'
targets:
  AISubscriptions:
    type: application
    platform: macOS
    sources: [App, Shared, Resources]
    dependencies:
      - target: AISubscriptionsWidget
        embed: true
    info:
      path: App/Info.plist
      properties:
        AISubAppGroup: $(APP_GROUP_ID)
    entitlements:
      path: App/AISubscriptions.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP_ID)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.dawang.aisubscriptions
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: AI订阅管家
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDevelopmentRegion: zh-Hans
  AISubscriptionsWidget:
    type: app-extension
    platform: macOS
    sources: [Widgets, Shared, Resources]
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: AI订阅管家小组件
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: zh-Hans
        AISubAppGroup: $(APP_GROUP_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/AISubscriptionsWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups: [$(APP_GROUP_ID)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.dawang.aisubscriptions.widget
        SKIP_INSTALL: YES
